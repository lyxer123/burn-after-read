    # one-time download (burn-after-read) proxy
    # nginx forwards /dl/<token> to the onedl service on the host.
    # When nginx is in a Docker container, point proxy_pass at the docker
    # bridge gateway IP (e.g. http://177.7.0.1:8777/) instead of 127.0.0.1.
    location ^~ /dl/ {
        proxy_pass http://127.0.0.1:8777/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }
